<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#181713" />
<link rel="manifest" href="manifest.webmanifest" />
<title>ちんだみ — 三線チューナー</title>
<style>
  :root{
    --bg:#f4f0e7;--panel:#fffdf8;--ink:#181713;--muted:#716d64;--line:#ded8cc;
    --accent:#a33b2b;--good:#27624a;--warn:#a76f18;--shadow:0 8px 28px rgba(42,36,28,.08);
  }
  *{box-sizing:border-box}
  html{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif}
  body{margin:0;min-height:100%;background:linear-gradient(180deg,#f8f5ee 0,#f1ece2 100%)}
  button,select{font:inherit}
  button{cursor:pointer}
  .app{max-width:720px;margin:0 auto;padding:18px 16px 32px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:4px 2px 18px}
  .brand{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:26px;font-weight:700;letter-spacing:.06em}
  .sub{font-size:12px;color:var(--muted);margin-top:2px;letter-spacing:.08em}
  .settings{display:flex;flex-direction:column;gap:6px;min-width:180px}
  .settings label,.advanced label{font-size:14px;font-weight:700}
  .intro{font-size:14px;line-height:1.7;color:var(--muted);margin:0 2px 14px}
  .advanced{padding:0 16px;margin-bottom:16px}
  .advanced summary{cursor:pointer;min-height:48px;padding:13px 0;font-size:14px;font-weight:700}
  .advanced-body{display:grid;gap:10px;padding:0 0 16px}
  .advanced p{font-size:13px;line-height:1.7;color:var(--muted);margin:0}
  .advanced select{width:100%;min-width:0}
  .strings-label{font-size:14px;font-weight:700;margin:18px 0 0}
  .string-btn .reading{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 34px 10px 12px;min-height:44px}
  .card{background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
  .tuner{padding:22px 18px 18px}
  .status{font-size:13px;color:var(--muted);min-height:20px}
  .pitch-readout{max-width:400px;margin:0 auto}
  .pitch-label{font-size:14px;font-weight:700}
  .pitch-hz{font-size:12px;color:var(--muted);white-space:nowrap}
  .live-pitch{padding:12px 0 8px;text-align:center}
  .live-value{color:var(--muted)}
  .live-pitch[data-state="measuring"] .live-value{color:var(--accent)}
  .live-pitch[data-state="matched"] .live-value{color:var(--good)}
  .status{text-align:center}
  .string-btn .target-hz{display:block;margin-top:5px;font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .live-value{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:baseline;gap:8px;margin:8px 0;font-variant-numeric:tabular-nums}
  .live-note{text-align:center;white-space:nowrap;font-family:ui-monospace,Consolas,monospace;font-size:clamp(48px,15vw,68px);line-height:1.1;letter-spacing:-.04em}
  .live-cents{text-align:right;font-family:ui-monospace,Consolas,monospace;font-size:clamp(23px,6vw,30px);font-weight:650;white-space:nowrap}
  .pitch-caption{font-size:12px;color:var(--muted);line-height:1.6;margin:6px 0 0}
  .meter-label{text-align:center;font-size:13px;color:var(--muted);margin:16px 0 0}
  .meter{position:relative;height:150px;margin:6px auto 0;max-width:520px;overflow:hidden}
  .arc{position:absolute;left:50%;bottom:-188px;width:420px;height:420px;border:1px solid var(--line);border-radius:50%;transform:translateX(-50%)}
  .tick{position:absolute;left:50%;bottom:10px;width:1px;height:118px;transform-origin:50% 108px}
  .tick:before{content:"";display:block;width:1px;height:10px;background:#a8a197}
  .tick.major:before{height:16px;width:2px;background:#6c675f}
  .tick.center:before{height:22px;width:3px;background:var(--good)}
  .needle{position:absolute;left:50%;bottom:10px;width:3px;height:106px;border-radius:4px;background:var(--accent);transform-origin:50% 100%;transform:translateX(-50%) rotate(0deg);transition:transform .12s ease-out,background .12s}
  .hub{position:absolute;left:50%;bottom:4px;width:14px;height:14px;background:var(--ink);border-radius:50%;transform:translateX(-50%)}
  .cents{text-align:center;margin-top:2px;font-size:17px;font-variant-numeric:tabular-nums;font-weight:650;min-height:27px}
  .hint{text-align:center;color:var(--muted);font-size:13px;min-height:20px}
  .strings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .string-btn{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 8px;min-height:72px;color:var(--ink)}
  .string-btn.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#fff9f2}
  .string-btn .jp{display:block;font-weight:700;font-size:14px}
  .string-btn .target{display:block;margin-top:6px;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .controls{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
  .start{border:0;background:var(--ink);color:white;border-radius:14px;padding:14px 18px;min-height:52px;font-weight:700;letter-spacing:.03em}
  .start.running{background:#5d342b}
  .cal{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:0 14px;min-height:52px;color:var(--ink)}
  .foot{font-size:11px;line-height:1.65;color:var(--muted);padding:14px 4px 0}
  .error{color:#8e2f25}
  @media(max-width:480px){
    header{align-items:flex-start;flex-direction:column}.settings{justify-content:flex-start;width:100%}.settings select{width:100%;min-width:0}.meter{height:138px}.strings{gap:7px}.string-btn{padding:10px 4px}.controls{grid-template-columns:1fr}.cal{min-height:46px}
  }
  /* 主要操作を縦画面にまとめ、詳細設定はその下へ。 */
  .app{padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 20px)}
  header{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;margin:0 2px 6px}
  .sub{margin:0;font-size:11px;white-space:nowrap}
  .intro{font-size:11px;line-height:1.5;margin:0 2px 8px}
  .tuner{padding:10px 12px 12px}
  .status{font-size:11px;min-height:17px}
  .live-pitch{padding:4px 0}
  .live-value{margin:4px 0}
  .live-note{font-size:clamp(44px,13vw,60px)}
  .live-cents{font-size:clamp(21px,5.5vw,28px)}
  .pitch-caption{font-size:11px;margin:3px 0 0}
  .meter-label{font-size:11px;margin:5px 0 0}
  .meter{height:120px;margin:8px auto 0}
  .cents{font-size:15px;min-height:23px}
  .hint{font-size:12px;min-height:18px}
  .strings-label{font-size:12px;margin:8px 0 0}
  .strings{gap:6px;margin-top:6px}
  .string-btn{padding:7px 3px;min-height:88px}
  .string-btn .target{font-size:22px;margin-top:3px}
  .string-btn .target-hz{font-size:11px;margin-top:2px}
  .controls{margin-top:8px}
  .start{min-height:44px;padding:10px 12px}
  .settings{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;padding:6px 12px;margin:8px 0;min-width:0}
  .settings label{font-size:13px}
  .settings select{width:100%;min-width:0}
  @media(max-height:700px) and (max-width:480px){
    .intro{display:none}
    .meter{height:96px}
    .tick{height:94px;transform-origin:50% 84px}
    .needle{height:82px}
    .live-note{font-size:44px}
    .string-btn{min-height:82px;padding:5px 3px}
  }
  @media(prefers-reduced-motion:reduce){.needle{transition:none}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">ちんだみ</div><div class="sub">三線チューナー</div>

  </header>
  <p class="intro">弦をタップしてお手本を聴く。マイクで自分の音を確認。</p>



  <section class="card tuner" aria-label="チューナー">
    <div class="status" id="status">マイクを開始してください</div>
    <div class="pitch-readout">
      <div class="live-pitch" id="livePitch" data-state="idle" aria-label="現在検出している音">
        <div class="pitch-label">今の音</div>
        <div class="live-value"><strong class="live-note" id="heardNote">—</strong><span class="live-cents" id="heardCents">— cent</span></div>
        <div class="pitch-hz" id="heardHz">音を待っています</div>
        <p class="pitch-caption">音名からのずれ　− 低い ／ ＋ 高い</p>
      </div>
    </div>

    <p class="meter-label">選んだ弦の目標まで</p>
    <div class="meter" aria-label="選んだ弦の目標に対する音程メーター">
      <div class="arc"></div>
      <div id="ticks"></div>
      <div class="needle" id="needle"></div><div class="hub"></div>
    </div>
    <div class="cents" id="cents">目標との差 — cent</div>
    <div class="hint" id="hint">音を鳴らしてください</div>

    <p class="strings-label" id="strings-label">各弦の目標音（タップして聴く）</p>
    <div class="strings" id="strings" role="group" aria-labelledby="strings-label"></div>
    <div class="controls">
      <button class="start" id="start">マイクを開始</button>
    </div>
  </section>

    <div class="card settings">
      <label for="tuning">調弦の種類</label>
      <select id="tuning">
        <option value="honcho">本調子</option>
        <option value="niage">二揚げ</option>
        <option value="sansage">三下げ</option>
        <option value="ichiniage">一二揚げ</option>
      </select>
    </div>

  <details class="card advanced">
    <summary>音の高さを変更（詳細設定）</summary>
    <div class="advanced-body">
      <label for="root">歌に合わせて3本とも高く・低くする</label>
      <p id="root-help">歌いにくいときだけ使います。ふだんはそのままで大丈夫です。</p>
      <select id="root" aria-describedby="root-help"></select>
      <button class="cal" id="cal" type="button">基準周波数 A4 = <span id="a4label">440</span> Hz</button>
    </div>
  </details>

  <div class="foot">針が中央に近づくように、各弦の高さを調整してください。全体の高さを変えるときは「音の高さを変更（詳細設定）」を開きます。マイクは端末内で音程検出にだけ使います。</div>
</main>
<script src="./reference-samples.js"></script>
<script>
(() => {
  const $=s=>document.querySelector(s);
  const noteNames=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const jpNames=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];
  const stringLabels=['男絃（うーぢる）','中絃（なかぢる）','女絃（みーぢる）'];
  const tuningDefs={
    honcho:{name:'本調子',steps:[0,5,12]},
    niage:{name:'二揚げ',steps:[0,7,12]},
    sansage:{name:'三下げ',steps:[0,5,10]},
    ichiniage:{name:'一二揚げ',steps:[2,7,12]}
  };
  let a4=440, selected=0, audio=null, analyser=null, stream=null, raf=0, running=false;
  let smooth=[];
  let lastDetectedTime=0, previousRms=0, attackSkipFrames=0;

  // 三線向けの検出設定。反応速度を保ちつつ、余韻と針の安定性を上げる。
  const RMS_THRESHOLD=0.006;
  const HOLD_MS=800;
  const ATTACK_RMS=0.03;
  const ATTACK_RATIO=2.6;
  const ONE_EURO_MIN_CUTOFF=2.0;
  const ONE_EURO_BETA=0.035;
  const ONE_EURO_D_CUTOFF=1.0;
  let euroValue=null, euroDerivative=0, euroTime=0;

  const root=$('#root'), tuning=$('#tuning'), start=$('#start'), needle=$('#needle');
  for(let midi=43;midi<=55;midi++){
    const n=midiToName(midi); const o=document.createElement('option'); o.value=String(midi); o.textContent=`${n.name}${n.oct}（${n.jp}）${midi===48?"・初期値":""}`; if(midi===48)o.selected=true; root.appendChild(o);
  }
  const ticks=$('#ticks');
  for(let i=-5;i<=5;i++){
    const d=document.createElement('div'); d.className='tick'+(i%5===0?' major':'')+(i===0?' center':''); d.style.transform=`translateX(-50%) rotate(${i*9}deg)`; ticks.appendChild(d);
  }

  function midiToName(midi){const pc=((midi%12)+12)%12;return {name:noteNames[pc],jp:jpNames[pc],oct:Math.floor(midi/12)-1,midi};}
  function freqForMidi(midi){return a4*Math.pow(2,(midi-69)/12)}
  function centsBetween(freq,target){return 1200*Math.log2(freq/target)}
  function targets(){const base=Number(root.value); return tuningDefs[tuning.value].steps.map(s=>base+s);}
  function pitchRange(){
    // 検出範囲は目標から独立させ、別の音を弾いても音名を表示する。
    return {min:55,max:700};
  }
  function resetPitchFilter(){euroValue=null;euroDerivative=0;euroTime=0;}
  function euroAlpha(cutoff,dt){const tau=1/(2*Math.PI*cutoff);return 1/(1+tau/dt);}
  function filterCents(value,now){
    if(euroValue===null||!euroTime){euroValue=value;euroDerivative=0;euroTime=now;return value;}
    const dt=Math.max(1/120,Math.min(0.25,(now-euroTime)/1000));
    const derivative=(value-euroValue)/dt;
    const aD=euroAlpha(ONE_EURO_D_CUTOFF,dt);
    euroDerivative=aD*derivative+(1-aD)*euroDerivative;
    const cutoff=ONE_EURO_MIN_CUTOFF+ONE_EURO_BETA*Math.abs(euroDerivative);
    const a=euroAlpha(cutoff,dt);
    euroValue=a*value+(1-a)*euroValue;
    euroTime=now;
    return euroValue;
  }

  // お手本の音はマイクとは独立して再生する。連打したら最後のタップを優先する。
  let speaker=null, voice=null, referenceRequest=0, listenAfter=0;
  function stopReference(){
    referenceRequest++;
    if(voice){
      voice.disconnect();
      voice.stop();
      voice=null;
      listenAfter=performance.now()+220;
    }
  }
  // Bundle the short recordings locally so tapping works offline and from a local HTML file.
  const decodedStrings = new Map();
  function recordedString(index){
    if(!decodedStrings.has(index)){
      const bytes = Uint8Array.from(atob(referenceSamples[index].wav), char => char.charCodeAt(0));
      const pending = speaker.decodeAudioData(bytes.buffer).catch(error => {
        decodedStrings.delete(index);
        throw error;
      });
      decodedStrings.set(index, pending);
    }
    return decodedStrings.get(index);
  }
  async function playReference(midi,stringIndex){
    stopReference();
    const request=referenceRequest;
    try{
      speaker ??= new (window.AudioContext||window.webkitAudioContext)();
      if(speaker.state!=='running') await speaker.resume();
      if(request!==referenceRequest || document.hidden)return;
      const sample=await recordedString(stringIndex);
      if(request!==referenceRequest || document.hidden)return;
      const speed=freqForMidi(midi)/referenceSamples[stringIndex].hz;
      const source=speaker.createBufferSource();
      source.buffer=sample;
      source.playbackRate.value=speed;
      source.connect(speaker.destination);
      voice=source;
      source.onended=()=>{
        source.disconnect();
        if(voice===source)voice=null;
        if(request===referenceRequest)$('#hint').textContent=running?'音を鳴らしてください':'もう一度タップすると聴けます';
      };
      $('#hint').textContent='目標音を再生中';
      // 再生後も少し待ち、スピーカーの余韻をマイクで判定しないようにする。
      listenAfter=performance.now()+(sample.duration/speed)*1000+220;
      source.start();
    }catch(e){
      if(request===referenceRequest)$('#hint').textContent='目標音を再生できませんでした';
    }
  }

  function render(){
    const strings=$('#strings');
    strings.textContent='';
    targets().forEach((midi,index)=>{
      const note=midiToName(midi);
      const button=document.createElement('button');
      button.type='button';
      button.className='string-btn'+(index===selected?' active':'');
      button.setAttribute('aria-pressed',String(index===selected));
      button.innerHTML=`<span class="jp">${stringLabels[index].split('（')[0]}</span>
        <span class="reading">${stringLabels[index].split('（')[1].replace('）','')}</span>
        <span class="target">${note.name}${note.oct}</span>
        <span class="target-hz">${freqForMidi(midi).toFixed(2)} Hz</span>`;
      button.addEventListener('click',()=>{
        selected=index;
        render();
        resetMeter();
        playReference(midi,index);
      });
      strings.appendChild(button);
    });
  }
  function clearHeardNote(){
    $('#livePitch').setAttribute('data-state','idle');
    $('#heardNote').textContent='—';
    $('#heardCents').textContent='— cent';
    $('#heardHz').textContent='音を待っています';
  }
  function resetMeter(keepHeardNote=false){
    if(keepHeardNote){
      // 余韻が消えたら最後の音を残し、灰色で過去の値と区別する。
      $('#livePitch').setAttribute('data-state','idle');
    }else clearHeardNote();
    smooth=[]; lastDetectedTime=0; previousRms=0; attackSkipFrames=0;
    resetPitchFilter();
    needle.style.transform='translateX(-50%) rotate(0deg)';
    needle.style.background='var(--muted)';
    $('#cents').textContent='目標との差 — cent';
    $('#hint').textContent='音を鳴らしてください';
  }
  function formatCents(value){
    const rounded=Math.round(value);
    if(rounded===0)return '0 cent';
    return (rounded>0?'+':'−')+Math.abs(rounded)+' cent';
  }

  async function toggleMic(){
    if(running){stopMic();return}
    if(!navigator.mediaDevices?.getUserMedia){$('#status').textContent='このブラウザではマイクを使えません';$('#status').classList.add('error');return}
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      audio=new (window.AudioContext||window.webkitAudioContext)(); await audio.resume();
      analyser=audio.createAnalyser(); analyser.fftSize=4096; analyser.smoothingTimeConstant=0;
      const source=audio.createMediaStreamSource(stream); source.connect(analyser);
      running=true; start.textContent='停止'; start.classList.add('running'); $('#status').classList.remove('error'); $('#status').textContent='聴いています'; smooth=[]; lastDetectedTime=0; previousRms=0; attackSkipFrames=0; resetPitchFilter(); loop();
    }catch(e){$('#status').textContent='マイクを許可してください';$('#status').classList.add('error')}
  }
  function stopMic(){running=false; cancelAnimationFrame(raf); stream?.getTracks().forEach(t=>t.stop()); audio?.close(); stream=audio=analyser=null; start.textContent='マイクを開始'; start.classList.remove('running'); $('#status').textContent='停止中'; resetMeter();}

  function loop(){
    if(!running||!analyser)return;
    if(voice || performance.now()<listenAfter){raf=requestAnimationFrame(loop);return;}
    const buf=new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(buf);
    let rms=0; for(const v of buf)rms+=v*v; rms=Math.sqrt(rms/buf.length);
    const now=performance.now();

    // 強い弾き始めは倍音が暴れやすいので、急激な立ち上がりだけ1フレーム見送る。
    if(rms>ATTACK_RMS && previousRms>0 && rms/previousRms>ATTACK_RATIO) attackSkipFrames=1;
    previousRms=rms;

    if(rms>RMS_THRESHOLD){
      if(attackSkipFrames>0){
        attackSkipFrames--;
      }else{
        const range=pitchRange();
        const f=detectPitch(buf,audio.sampleRate,range.min,range.max);
        if(f && f>=range.min && f<=range.max){
          lastDetectedTime=now;
          smooth.push(f); if(smooth.length>5)smooth.shift();
          const sf=[...smooth].sort((a,b)=>a-b)[Math.floor(smooth.length/2)];
          updatePitch(sf,now);
        }
      }
    }
    if(!lastDetectedTime || now-lastDetectedTime>HOLD_MS){
      if(smooth.length)resetMeter(true);
      $('#status').textContent=$('#heardNote').textContent==='—'?'音を待っています':'音を待っています（前回の音を表示）';
      $('#hint').textContent='音を鳴らしてください';
    }
    raf=requestAnimationFrame(loop);
  }

  // YIN pitch detector. 三線向けの周波数帯を探索する。
  function detectPitch(buffer,sampleRate,minFreq,maxFreq){
    const threshold=0.13;
    const minTau=Math.max(2,Math.floor(sampleRate/maxFreq));
    const maxTau=Math.min(Math.floor(sampleRate/minFreq),Math.floor(buffer.length/2));
    const yin=new Float32Array(maxTau+1);
    for(let tau=1;tau<=maxTau;tau++){
      let sum=0; for(let i=0;i<buffer.length-maxTau;i++){const d=buffer[i]-buffer[i+tau];sum+=d*d} yin[tau]=sum;
    }
    yin[0]=1; let runningSum=0;
    for(let tau=1;tau<=maxTau;tau++){runningSum+=yin[tau];yin[tau]=runningSum?yin[tau]*tau/runningSum:1;}
    let tauEstimate=-1;
    for(let tau=minTau;tau<=maxTau;tau++){
      if(yin[tau]<threshold){while(tau+1<=maxTau&&yin[tau+1]<yin[tau])tau++;tauEstimate=tau;break;}
    }
    if(tauEstimate<0)return null;
    let better=tauEstimate;
    if(tauEstimate>1&&tauEstimate<maxTau){
      const s0=yin[tauEstimate-1],s1=yin[tauEstimate],s2=yin[tauEstimate+1];
      const denom=2*(2*s1-s2-s0); if(Math.abs(denom)>1e-9) better=tauEstimate+(s2-s0)/denom;
    }
    return sampleRate/better;
  }

  function updatePitch(freq,now=performance.now()){
    if(!Number.isFinite(freq) || freq<=0){resetMeter();return;}
    const target=freqForMidi(targets()[selected]);
    const cents=centsBetween(freq,target);
    let filtered=filterCents(cents,now);

    // 中央付近のごく小さな揺れは針だけ固定。数値は実測値を表示する。
    if(Math.abs(filtered)<0.8) filtered=0;
    const shown=Math.max(-50,Math.min(50,filtered));
    const deg=shown/50*45; needle.style.transform=`translateX(-50%) rotate(${deg}deg)`;
    const inTune=Math.abs(cents)<=5; needle.style.background=inTune?'var(--good)':'var(--accent)';
    $('#livePitch').setAttribute('data-state',inTune?'matched':'measuring');
    $('#cents').textContent='目標との差 '+formatCents(cents);
    const heardMidi=Math.round(69+12*Math.log2(freq/a4));
    const heard=midiToName(heardMidi);
    const nearestHz=freqForMidi(heardMidi);
    // 音名とcentは同じ中央値周波数から求め、音名の切り替わりで食い違わせない。
    $('#heardNote').textContent=heard.name+heard.oct;
    $('#heardCents').textContent=formatCents(centsBetween(freq,nearestHz));
    $('#heardHz').textContent=heard.jp+' / '+freq.toFixed(2)+' Hz';
    $('#status').textContent='検出中';
    $('#hint').textContent=inTune?'合っています':(cents<0?'もう少し上げる':'もう少し下げる');
  }

  start.addEventListener('click',toggleMic);
  tuning.addEventListener('change',()=>{stopReference();selected=0;smooth=[];resetPitchFilter();render();resetMeter()});
  root.addEventListener('change',()=>{stopReference();selected=0;smooth=[];resetPitchFilter();render();resetMeter()});
  $('#cal').addEventListener('click',()=>{const next=prompt('基準の A4 周波数（Hz）',String(a4)); if(next===null)return; const n=Number(next); if(n>=430&&n<=450){stopReference();a4=n;$('#a4label').textContent=String(n);smooth=[];resetPitchFilter();render();resetMeter()}else alert('430〜450 Hz の範囲で入力してください。')});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stopReference();if(running)stopMic();}});
  render();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
